name: coupon-scraper

services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES__USER:-coupon_scraper}
      POSTGRES_PASSWORD: ${POSTGRES__PASSWORD:?заполните POSTGRES__PASSWORD в .env (см. .env.example)}
      POSTGRES_DB: ${POSTGRES__DATABASE:-coupon_scraper}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"

    ports:
      - "127.0.0.1:${POSTGRES__PORT:-5432}:5432"

    volumes:
      - postgres-data:/var/lib/postgresql

    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U $${POSTGRES_USER} -d $${POSTGRES_DB} -q"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 1s

    user: "postgres"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/run/postgresql
      - /tmp

    shm_size: 256mb
    stop_grace_period: 30s

    networks: [coupon-scraper-network]

  redis:
    image: redis:8.8.2
    restart: unless-stopped

    command:
      - redis-server
      - --requirepass
      - ${REDIS__PASSWORD:?заполните REDIS__PASSWORD в .env}
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction

    environment:
      REDISCLI_AUTH: ${REDIS__PASSWORD:?заполните REDIS__PASSWORD в .env}

    ports:
      - "127.0.0.1:${REDIS__PORT:-6379}:6379"

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
      start_interval: 1s

    user: "redis"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    mem_limit: 320m

    networks: [coupon-scraper-network]

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${STORAGE__ACCESS_KEY_ID:?заполните STORAGE__ACCESS_KEY_ID в .env}
      MINIO_ROOT_PASSWORD: ${STORAGE__SECRET_ACCESS_KEY:?заполните STORAGE__SECRET_ACCESS_KEY в .env}

    ports:
      - "127.0.0.1:9010:9000"
      - "127.0.0.1:9011:9001"

    volumes:
      - minio-data:/data

    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
      start_interval: 1s

    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m

    networks: [coupon-scraper-network]

  minio-init:
    image: minio/minio:latest
    restart: "no"

    depends_on:
      minio:
        condition: service_healthy

    entrypoint:
      - sh
      - -c
      - |
        mc alias set stand http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "stand/$$BUCKET" &&
        mc anonymous set none "stand/$$BUCKET"

    environment:
      MINIO_ROOT_USER: ${STORAGE__ACCESS_KEY_ID:?заполните STORAGE__ACCESS_KEY_ID в .env}
      MINIO_ROOT_PASSWORD: ${STORAGE__SECRET_ACCESS_KEY:?заполните STORAGE__SECRET_ACCESS_KEY в .env}
      BUCKET: ${STORAGE__BUCKET:-coupon-shots}

    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

    networks: [coupon-scraper-network]

volumes:
  postgres-data:
  redis-data:
  minio-data:

networks:
  coupon-scraper-network:
    driver: bridge

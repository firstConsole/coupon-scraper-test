name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  POETRY_VERSION: "2.3.2"

jobs:
  quality:
    name: Линтер, типы и тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Установить Poetry
        run: pipx install "poetry==${{ env.POETRY_VERSION }}"

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: poetry

      - name: Установить зависимости
        run: poetry install

      - name: make check
        run: make check

  hooks:
    name: Гигиена файлов
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Установить pre-commit
        run: pipx install pre-commit

      - name: Прогнать хуки по всем файлам
        env:
          SKIP: gitleaks,no-commit-to-branch,mypy,pytest
        run: pre-commit run --all-files --show-diff-on-failure

  secrets:
    name: Поиск секретов в истории
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks
        run: |
          docker run --rm --volume "$PWD:/repo" --workdir /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.0 \
            git --redact --verbose --no-banner

  image:
    name: Сборка образа и стенд
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Собрать
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: coupon-scraper:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Образ поднимается и представляется
        run: docker run --rm coupon-scraper:ci --version

      - name: Образ работает не от root
        run: |
          test "$(docker run --rm --entrypoint id coupon-scraper:ci -u)" != "0" \
            || { echo "образ работает от root"; exit 1; }

      - name: В рабочем образе нет dev-зависимостей
        run: |
          docker run --rm --entrypoint python coupon-scraper:ci -c "
          import importlib.util as u, sys
          leaked = [m for m in ('pytest', 'ruff', 'mypy', 'pre_commit') if u.find_spec(m)]
          sys.exit(f'в рабочем образе dev-зависимости: {leaked}' if leaked else 0)
          "

      - name: Приложение не может переписать собственный код
        run: |
          docker run --rm --entrypoint sh coupon-scraper:ci \
            -c 'touch /app/src/coupon_scraper/__init__.py' 2>/dev/null \
            && { echo "исходники доступны на запись"; exit 1; } \
            || echo "исходники защищены от записи"

      - name: В образе нет setuid-бинарников
        run: |
          found=$(docker run --rm --entrypoint sh coupon-scraper:ci \
            -c 'find / -xdev -perm /6000 -type f 2>/dev/null | wc -l')
          test "$found" -eq 0 || { echo "setuid-бинарников: $found"; exit 1; }

      - name: Стенд разбирается без ошибок
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES__PASSWORD=$/POSTGRES__PASSWORD=ci-only-1/' .env
          sed -i 's/^REDIS__PASSWORD=$/REDIS__PASSWORD=ci-only-2/' .env
          sed -i 's/^STORAGE__ACCESS_KEY_ID=$/STORAGE__ACCESS_KEY_ID=ci-only-3/' .env
          sed -i 's/^STORAGE__SECRET_ACCESS_KEY=$/STORAGE__SECRET_ACCESS_KEY=ci-only-4/' .env
          docker compose config --quiet
